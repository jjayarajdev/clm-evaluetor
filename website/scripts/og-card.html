<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F6F3; --paper-2: #EFEDE8; --ink: #0E0E10; --ink-2: #2D2F36; --ink-3: #5B5F66;
    --orange: #E94E1B; --rule: #1A1A1C; --rule-2: #D8D5CD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper);
    font-family: 'Geist', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .card { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark { width: 40px; height: 40px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 22px; }
  .word { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .label { font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .label b { color: var(--orange); font-weight: 500; margin: 0 10px; }
  .headline { font-size: 88px; font-weight: 500; letter-spacing: -0.03em; line-height: 0.98; }
  .headline em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 22px; }
  .sub { font-size: 22px; color: var(--ink-2); max-width: 720px; line-height: 1.35; }
  .strip { display: flex; gap: 40px; }
  .kv { display: flex; flex-direction: column; gap: 6px; }
  .kv .k { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .kv .v { font-size: 15px; font-weight: 500; }
  .dot { position: absolute; right: 72px; top: 64px; width: 10px; height: 10px; background: var(--orange); border-radius: 50%; display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand"><div class="mark">E</div><div class="word">Evaluetor</div></div>
      <div class="label">AI-native CLM<b>·</b>The Netherlands</div>
    </div>
    <div class="headline">Contracts <em>create value.</em><br>Execution <em>protects it.</em></div>
    <div class="bottom">
      <div class="sub">Obligations, SLAs, risk, renewals and relationships — read from your contracts and watched during execution.</div>
      <div class="strip">
        <div class="kv"><span class="k">Built for</span><span class="v">EU mid-large enterprise</span></div>
        <div class="kv"><span class="k">Residency</span><span class="v">EU regions</span></div>
      </div>
    </div>
  </div>
</body>
</html>
